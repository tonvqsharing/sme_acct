[project]
name = "sme-acct"
version = "0.1.0"
description = "Vietnamese SME accounting workflow"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "flask-migrate>=4.0,<5.0",
    "Flask-Talisman>=1.1,<2.0",
    "python-dotenv>=1.0,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "email-validator>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "black>=24.0,<25.0",
    "ruff>=0.3,<0.4",
    "mypy>=1.8,<2.0",
    "Flask-Testing>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
