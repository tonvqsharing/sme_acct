[project]
name = "sme-acct"
version = "0.1.0"
description = "Vietnamese SME Accounting Application"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
